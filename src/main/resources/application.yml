# Mirrors the NestJS bootstrap: .env is loaded from the working directory,
# the API is served on port 1996 under the global "/api" prefix.
spring:
  application:
    name: kanban-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      repositories:
        enabled: false
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=${POSTGRES_SSLMODE:prefer}&stringtype=unspecified
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Parse an upload only when the controller asks for the file -- after JwtAuthInterceptor,
      # so anonymous requests are rejected unread. Size limits: StorageConfig (ATTACHMENT_MAX_SIZE).
      resolve-lazily: true

server:
  port: ${PORT:1996}
  forward-headers-strategy: native
  tomcat:
    # How much of an over-limit upload Tomcat reads and discards so the client still receives
    # the 413 body instead of a reset connection (default 2MB).
    max-swallow-size: 50MB
    # Each multipart part's headers (they carry the raw UTF-8 file name) may be this large; Tomcat's
    # 512B default turns a ~150-character Vietnamese name into a false "413 File is too large".
    max-part-header-size: 2KB
    remoteip:
      # Match no proxies by default (including loopback/private networks).
      internal-proxies: '${TRUSTED_PROXY_REGEX:(?!)}'
  error:
    whitelabel:
      enabled: false

# Application settings (env var names preserved from the Nest app)
app:
  env: ${NODE_ENV:development}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window: ${RATE_LIMIT_WINDOW:60s}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:kanban:local:rate-limit}
  dashboard-cache:
    enabled: ${DASHBOARD_CACHE_ENABLED:false}
    ttl: ${DASHBOARD_CACHE_TTL:60s}
    key-prefix: ${DASHBOARD_CACHE_KEY_PREFIX:kanban:local:dashboard}
  jwt:
    secret: ${JWT_SECRET}
    expires-in: ${JWT_EXPIRES_IN:1h}
  refresh-token:
    expires-in: ${REFRESH_TOKEN_EXPIRES_IN:30d}
  socket-io:
    port: ${SOCKET_IO_PORT:1997}
    enabled: ${SOCKET_IO_ENABLED:true}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:task-attachments}
    access-key-id: ${STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:}
    force-path-style: ${STORAGE_FORCE_PATH_STYLE:true}
  attachments:
    max-size: ${ATTACHMENT_MAX_SIZE:10MB}
    download-url-ttl: ${ATTACHMENT_DOWNLOAD_URL_TTL:5m}

springdoc:
  api-docs:
    path: /api/docs-json
  swagger-ui:
    path: /api/docs
    url: /api/docs-json
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.kanban: INFO
