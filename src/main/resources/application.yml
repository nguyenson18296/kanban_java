# Mirrors the NestJS bootstrap: .env is loaded from the working directory,
# the API is served on port 1996 under the global "/api" prefix.
spring:
  application:
    name: kanban-backend
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=${POSTGRES_SSLMODE:prefer}&stringtype=unspecified
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:1996}
  error:
    whitelabel:
      enabled: false

# Application settings (env var names preserved from the Nest app)
app:
  env: ${NODE_ENV:development}
  jwt:
    secret: ${JWT_SECRET}
    expires-in: ${JWT_EXPIRES_IN:1h}
  refresh-token:
    expires-in: ${REFRESH_TOKEN_EXPIRES_IN:30d}
  socket-io:
    port: ${SOCKET_IO_PORT:1997}
    enabled: ${SOCKET_IO_ENABLED:true}

springdoc:
  api-docs:
    path: /api/docs-json
  swagger-ui:
    path: /api/docs
    url: /api/docs-json
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.kanban: INFO
