# Offline alternative to the Cloudflare R2 bucket for task attachments (JSP-40).
#   docker compose -f compose.storage.yml up -d --wait
#   docker compose -f compose.storage.yml exec minio mc mb --ignore-existing local/task-attachments
# Console: http://127.0.0.1:9001 (minioadmin / minioadmin). Buckets are private by default.
#
# MinIO's community images stopped receiving updates in late 2025: this tag is pinned on
# purpose. If `docker pull` cannot find it, use the newest RELEASE.* tag on Docker Hub.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets `exec minio mc …` (and the healthcheck) reach this server without an alias setup.
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15
